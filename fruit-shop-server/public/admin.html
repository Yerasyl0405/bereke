.notice {

</style>
</head>

<body>

<main>

<header class="header">
  <div class="brand">
    <div class="logo">🌿</div>
    <div>
      <h1>Береке</h1>
      <p>Админ-панель магазина</p>
    </div>
  </div>

  <div class="online">Онлайн</div>
</header>

<div class="tabs" id="tabs"></div>

<div id="view">
  <div class="card empty">
    <div class="empty-icon">🌿</div>
    Загрузка панели...
  </div>
</div>

</main>

<script>
const $ = id => document.getElementById(id);

const esc = s => String(s ?? "").replace(/[&<>"']/g, c =>
  ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;"
  }[c])
);

const fmt = n =>
  Math.round(Number(n) || 0).toLocaleString("ru-RU") + " ₸";

const ST = {
  pending: "Ожидает оплаты",
  reported: "Клиент сообщил об оплате",
  paid: "Оплачен",
  delivering: "В доставке",
  done: "Выполнен",
  cancelled: "Отменён"
};

const NEXT = {
  pending: [
    ["paid", "✓ Подтвердить оплату"],
    ["cancelled", "✕ Отменить"]
  ],
  reported: [
    ["paid", "✓ Подтвердить оплату"],
    ["cancelled", "✕ Отменить"]
  ],
  paid: [
    ["delivering", "🚚 Передать в доставку"],
    ["cancelled", "✕ Отменить"]
  ],
  delivering: [
    ["done", "✓ Выполнен"]
  ]
};

let tab = "orders";
let orders = [];
let products = [];
let settings = {};

/* API */

async function api(method, url, body) {
  const r = await fetch(url, {
    method,
    headers: {
      "Content-Type": "application/json"
    },
    body: body ? JSON.stringify(body) : undefined
  });

  if (!r.ok) {
    const e = await r.json().catch(() => ({}));
    throw new Error(e.error || r.status);
  }

  return r.json();
}

/* IMAGE RESIZE */

function shrink(file) {
  return new Promise((res, rej) => {
    const r = new FileReader();

    r.onerror = () =>
      rej(new Error("Не удалось прочитать файл"));

    r.onload = () => {
      const im = new Image();

      im.onerror = () =>
        rej(new Error("Это не изображение"));

      im.onload = () => {
        const k = Math.min(1, 900 / im.width);

        const c = document.createElement("canvas");

        c.width = im.width * k;
        c.height = im.height * k;

        c.getContext("2d").drawImage(
          im, 0, 0, c.width, c.height
        );

        res(c.toDataURL("image/jpeg", .85));
      };

      im.src = r.result;
    };

    r.readAsDataURL(file);
  });
}

/* LOAD DATA */

async function load() {
  const data = await Promise.all([
    api("GET", "/api/admin/orders"),
    api("GET", "/api/admin/products"),
    api("GET", "/api/admin/settings")
  ]);

  orders = data[0];
  products = data[1];
  settings = data[2];

  render();
}

/* STATUS CLASS */

function statusClass(status) {
  return status === "reported" ? "reported" :
    status === "paid" ? "paid" :
    status === "delivering" ? "delivering" :
    status === "done" ? "done" :
    status === "cancelled" ? "cancelled" : "";
}

/* RENDER */

function render() {

  const fresh = orders.filter(
    o => o.status === "reported"
  ).length;

  $("tabs").innerHTML = [
    ["orders", `📦 Заказы (${fresh})`],
    ["products", "🛍 Товары"],
    ["settings", "⚙ Настройки"]
  ].map(([k, t]) => `
    <button
      aria-pressed="${k === tab}"
      data-tab="${k}">
      ${t}
    </button>
  `).join("");

  let h = "";

  /* ORDERS */

  if (tab === "orders") {

    h = `
      <div class="card">
        <div class="card-title">
          <h2>📦 Заказы</h2>
          <button data-refresh>↻ Обновить</button>
        </div>

        ${orders.length ? orders.map(o => `
          <div class="card" style="margin-bottom:13px">

            <div class="order-top">
              <div>
                <div class="order-name">
                  №${esc(o.id)} · ${esc(o.name)}
                </div>
                <small>📞 ${esc(o.phone)}</small>
              </div>

              <span class="badge ${statusClass(o.status)}">
                ${esc(ST[o.status] || o.status)}
              </span>
            </div>

            <small>
              📅 ${new Date(o.created_at).toLocaleString("ru-RU")}
            </small>

            <div class="order-info">
              <div>📍 ${esc(o.addr)}</div>
              <div>🕒 ${esc(o.time || "Время не указано")}</div>
              <div>💬 ${esc(o.note || "Без комментария")}</div>
            </div>

            <div class="order-items">
              ${o.items.map(i => `
                <div class="line">
                  <span>
                    ${esc(i.n)} — ${esc(i.q)} кг
                  </span>
                  <b>${fmt(i.q * i.p)}</b>
                </div>
              `).join("")}
            </div>

            <div class="row" style="margin-top:14px">
              <b class="order-total">
                Итого: ${fmt(o.total)}
              </b>

              <div class="order-actions">
                ${(NEXT[o.status] || []).map(([s, l]) => `
                  <button
                    class="${s === "paid" || s === "done" ? "pri" : s === "cancelled" ? "danger" : ""}"
                    data-oid="${esc(o.id)}"
                    data-st="${s}">
                    ${l}
                  </button>
                `).join("")}

                ${["done", "cancelled"].includes(o.status) ? `
                  <button
                    class="danger"
                    data-odel="${esc(o.id)}">
                    🗑 Удалить
                  </button>
                ` : ""}
              </div>
            </div>

          </div>
        `).join("") : `
          <div class="empty">
            <div class="empty-icon">📦</div>
            <b>Заказов пока нет</b>
            <p>Новые заказы появятся здесь.</p>
          </div>
        `}

        <div class="notice">
          ℹ️ Автоматическое обновление каждые 15 секунд
        </div>
      </div>
    `;
  }

  /* PRODUCTS */

  if (tab === "products") {

    h = `
      <div class="card">

        <div class="card-title">
          <h2>🛍 Товары</h2>
        </div>

        <b>Добавить новый товар</b>

        <div class="product-add" style="margin-top:13px">

          <input
            id="nE"
            placeholder="🍎 Эмодзи"
            maxlength="8">

          <input
            id="nN"
            placeholder="Название товара">

          <input
            id="nC"
            placeholder="Категория">

          <input
            id="nP"
            type="number"
            min="1"
            placeholder="Цена ₸/кг">

          <button class="pri" data-padd>
            + Добавить
          </button>

        </div>
      </div>

      <div class="card">

        <div class="card-title">
          <h2>📋 Список товаров</h2>
          <small>${products.length} товаров</small>
        </div>

        ${products.length ? products.map(p => `
          <div class="line">

            <div class="product-info">

              ${p.image ? `
                <img
                  class="product-image"
                  src="${esc(p.image)}"
                  alt="">
              ` : `
                <span style="font-size:30px">
                  ${esc(p.emoji)}
                </span>
              `}

              <div>
                <div class="product-name">
                  ${esc(p.name)}
                </div>

                <small>${esc(p.category)}</small>
              </div>

              <span class="product-status ${p.active ? "" : "hidden"}">
                ${p.active ? "Активен" : "Скрыт"}
              </span>

            </div>

            <div class="product-info">

              <input
                type="number"
                min="1"
                value="${esc(p.price)}"
                data-pid="${esc(p.id)}"
                aria-label="Цена товара"
                style="width:105px;flex:none">

              <b>₸</b>

              <label class="btnl">
                📷 Фото
                <input
                  type="file"
                  accept="image/*"
                  data-pimg="${esc(p.id)}"
                  hidden>
              </label>

              <button data-pact="${esc(p.id)}">
                ${p.active ? "👁 Скрыть" : "👁 Показать"}
              </button>

              <button
                class="danger"
                data-pdel="${esc(p.id)}">
                🗑 Удалить
              </button>

            </div>

          </div>
        `).join("") : `
          <div class="empty">
            <div class="empty-icon">🍎</div>
            Товаров пока нет
          </div>
        `}

      </div>
    `;
  }

  /* SETTINGS */

  if (tab === "settings") {

    const fields = [
      ["kaspiPhone", "📱 Номер Kaspi для переводов"],
      ["kaspiLink", "🔗 Ссылка Kaspi QR / Kaspi Pay (необязательно)"],
      ["freeFrom", "🚚 Бесплатная доставка от, ₸"],
      ["deliveryFee", "💰 Стоимость доставки, ₸"],
      ["minOrder", "🛒 Минимальный заказ, ₸"]
    ];

    h = `
      <div class="card">

        <div class="card-title">
          <h2>⚙ Настройки магазина</h2>
        </div>

        ${fields.map(([k, l]) => `
          <div class="setting-field">
            <label for="s_${k}">
              ${l}
            </label>

            <input
              id="s_${k}"
              data-set="${k}"
              value="${esc(settings[k] ?? "")}"
              style="width:100%">
          </div>
        `).join("")}

        <button class="pri save-button" data-sset>
          💾 Сохранить настройки
        </button>

      </div>
    `;
  }

  $("view").innerHTML = h;
}

/* CLICK EVENTS */

document.addEventListener("click", async e => {

  const t = e.target.closest("button");

  if (!t) return;

  try {

    if (t.dataset.tab) {
      tab = t.dataset.tab;
      return render();
    }

    if (t.hasAttribute("data-refresh")) {
      await load();
      return;
    }

    if (t.dataset.st) {

      t.disabled = true;

      await api(
        "PATCH",
        "/api/admin/orders/" + encodeURIComponent(t.dataset.oid),
        { status: t.dataset.st }
      );

    }

    else if (t.dataset.odel) {

      if (!confirm("Удалить заказ?")) return;

      await api(
        "DELETE",
        "/api/admin/orders/" + encodeURIComponent(t.dataset.odel)
      );

    }

    else if (t.hasAttribute("data-padd")) {

      const emoji = $("nE").value.trim();
      const name = $("nN").value.trim();
      const category = $("nC").value.trim();
      const price = $("nP").value;

      if (!name || !category || !price || Number(price) <= 0) {
        alert("Заполните название, категорию и правильную цену");
        return;
      }

      await api("POST", "/api/admin/products", {
        emoji,
        name,
        category,
        price
      });

    }

    else if (t.dataset.pact) {

      const p = products.find(
        x => x.id == t.dataset.pact
      );

      if (!p) return;

      await api(
        "PATCH",
        "/api/admin/products/" + encodeURIComponent(p.id),
        { active: !p.active }
      );

    }

    else if (t.dataset.pdel) {

      if (!confirm("Удалить товар?")) return;

      await api(
        "DELETE",
        "/api/admin/products/" + encodeURIComponent(t.dataset.pdel)
      );

    }

    else if (t.hasAttribute("data-sset")) {

      const v = {};

      document.querySelectorAll("[data-set]").forEach(i => {
        v[i.dataset.set] = i.value;
      });

      await api("PUT", "/api/admin/settings", v);

      alert("Настройки успешно сохранены!");

    }

    else {
      return;
    }

    await load();

  } catch (err) {

    alert("Ошибка: " + err.message);

    if (t.isConnected) t.disabled = false;

  }

});

/* CHANGE EVENTS */

document.addEventListener("change", async e => {

  /* PRODUCT IMAGE */

  if (e.target.dataset.pimg && e.target.files[0]) {

    try {

      const data = await shrink(e.target.files[0]);

      await api(
        "POST",
        "/api/admin/products/" +
        encodeURIComponent(e.target.dataset.pimg) +
        "/image",
        { data }
      );

      await load();

    } catch (err) {

      alert("Ошибка загрузки фото: " + err.message);

    }

    return;
  }

  /* PRODUCT PRICE */

  if (!e.target.dataset.pid) return;

  const price = Number(e.target.value);

  if (!Number.isFinite(price) || price <= 0) {
    alert("Введите правильную цену");
    return;
  }

  try {

    await api(
      "PATCH",
      "/api/admin/products/" +
      encodeURIComponent(e.target.dataset.pid),
      { price }
    );

    await load();

  } catch (err) {

    alert("Ошибка изменения цены: " + err.message);

  }

});

/* INITIALIZATION */

load().catch(err => {

  $("view").innerHTML = `
    <div class="card empty">
      <div class="empty-icon">⚠️</div>
      <b>Не удалось загрузить данные</b>
      <p>${esc(err.message)}</p>
      <button class="pri" onclick="location.reload()">
        Повторить
      </button>
    </div>
  `;

});

/* AUTO REFRESH */

setInterval(() => {

  if (
    tab === "orders" &&
    !document.activeElement.matches("input")
  ) {
    load().catch(() => {});
  }

}, 15000);

</script>

</body>
</html>
